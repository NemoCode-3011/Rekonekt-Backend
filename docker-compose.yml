services:
 postgres:
  image: postgres:18-alpine
  environment:
   POSTGRES_USER: postgres
   POSTGRES_PASSWORD: postgres
   POSTGRES_DB: rekonekt
  ports:
   - "5433:5432"
  volumes:
   - postgres_data:/var/lib/postgresql
 redis:
  image: redis:alpine
  ports:
   - "6379:6379" 
   

volumes:
  postgres_data:
  
